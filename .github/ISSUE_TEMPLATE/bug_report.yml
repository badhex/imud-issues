name: Bug report
description: Report something broken in InflictMUD.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please fill in the fields that apply.

        If you opened this from the in-game bug button, the Support trace ID and Game context fields should already be filled in. The trace ID lets us find the related server logs.

        The in-game dialog may show client-side console messages or errors. Paste them into the field below only if they look relevant to the problem.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Briefly describe what broke. Include the exact UI, command, item, monster, room, store action, or system involved.
      placeholder: "Example: Buying an Arcanits pack completed in Stripe, but my in-game balance did not update."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should the game have done instead?
      placeholder: "Example: My Arcanits balance should increase after checkout completes."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened? Include visible error messages, stuck states, missing updates, wrong values, or disconnects.
      placeholder: "Example: The checkout closed, but the balance stayed at 0 and no error was shown."
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that triggers the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: game-context
    attributes:
      label: Game context
      description: Add any relevant in-game context. Leave unknown fields blank.
      value: |
        Character:
        Area / room:
        Command or action:
        Item / skill / monster / NPC:
        Account ID:
    validations:
      required: false

  - type: input
    id: support-trace-id
    attributes:
      label: Support trace ID
      description: Filled by the in-game bug button. If it is blank, submit the report anyway.
      placeholder: "imud-YYYYMMDDHHMMSS-xxxxxxxx"
    validations:
      required: false

  - type: textarea
    id: client-console
    attributes:
      label: Client-side console messages / errors
      description: If the in-game dialog showed relevant browser console messages or errors, paste them here. Leave blank if there were none or they do not seem related.
      placeholder: "Paste messages from the in-game dialog here if relevant."
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      description: How often does this happen?
      options:
        - Always
        - Sometimes
        - Once
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How much does this affect play?
      options:
        - Blocking - I cannot continue
        - Major - core gameplay or purchases are affected
        - Minor - inconvenient but avoidable
        - Cosmetic - display or text issue only
        - Not sure
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a way around the problem, describe it here.
      placeholder: "Example: Reloading the page refreshed the balance."
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Add screenshots, short recordings, or links if they help explain the problem. Do not paste passwords, one-time codes, or private authentication tokens.
      placeholder: "Drag and drop screenshots or recordings here after the issue is created, or paste links."
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I checked that this report does not include passwords, one-time codes, or private authentication tokens.
          required: true
